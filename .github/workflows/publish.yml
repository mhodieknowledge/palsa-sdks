# Publishing a client to its registry.
#
# Manual only, and one client at a time. Publishing cannot be undone in the ways that matter: a version
# number cannot be reused, a package that has been fetched once is out there, and a wrong artefact under
# a real name is worse than no package at all. So nothing here runs on a push.
#
# Every job needs a secret. They are named under each one, and until they are set the job fails at the
# authentication step, which is the correct failure.
name: Publish a client

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which client
        required: true
        type: choice
        options: [typescript, python, dart, java, kotlin, csharp, go, php, swift]
      version:
        description: The version, e.g. 0.1.0. It must not already exist in the registry.
        required: true
        type: string
      confirm:
        description: Type publish to confirm. Anything else stops the run.
        required: true
        type: string

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A wrong repository or homepage is not caught by any build: it compiles, it publishes, and it
      # sends people to the wrong place for the life of the package. Checked before anything is sent.
      - name: Check every client points at this repository
        run: bash scripts/audit-metadata.sh --check
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "publish" ]; then
            echo "Not confirmed. Type publish in the confirm box to run this." >&2
            exit 1
          fi
          case "${{ inputs.version }}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "The version must look like 1.2.3." >&2; exit 1 ;;
          esac

  # No secret. npm trusted publishing: the registry accepts the run's OIDC identity in place of a
  # token, which means there is no long-lived credential to leak or rotate. It also attaches
  # provenance, so anyone can see which workflow and commit produced the tarball.
  typescript:
    needs: guard
    if: inputs.target == 'typescript'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults: { run: { working-directory: clients/typescript } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', registry-url: 'https://registry.npmjs.org' }
      # Trusted publishing needs a recent CLI; the one bundled with Node 22 predates it.
      - run: npm install -g npm@latest
        working-directory: .
      # --allow-same-version, because the committed manifest already carries a version and npm treats
      # setting it to the same string as an error rather than a no-op.
      - run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm install && npm run build --if-present
      - run: npm publish --access public --provenance

  # No secret: PyPI trusted publishing.
  python:
    needs: guard
    if: inputs.target == 'python'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Set the version
        working-directory: clients/python
        run: |
          sed -i "s|^version = .*|version = \"${{ inputs.version }}\"|" pyproject.toml
      - name: Build
        working-directory: clients/python
        run: pip install build && python -m build
      # No password: with id-token write and a trusted publisher configured on the project, PyPI
      # takes the run's OIDC identity instead.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist

  # No secret. pub.dev automated publishing checks that the run was started by a tag matching the
  # pattern configured on the package, so this job only makes the tag. dart-publish.yml is what that
  # tag then triggers, and the publish happens there with the run's own OIDC identity.
  dart:
    needs: guard
    if: inputs.target == 'dart'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      # The tag has to be pushed with a personal access token, not the run's own GITHUB_TOKEN.
      # GitHub refuses to start a workflow from a push made with that token, by design, to stop a
      # workflow triggering itself forever. The tag lands either way and nothing starts, which looks
      # exactly like a broken trigger, so the token is checked up front.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SDK_MIRROR_TOKEN || github.token }}
      - name: Set the version and tag it
        env:
          HAVE_PAT: ${{ secrets.SDK_MIRROR_TOKEN != '' }}
        run: |
          tag="dart-v${{ inputs.version }}"
          sed -i "s|^version: .*|version: '${{ inputs.version }}'|" clients/dart/pubspec.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clients/dart/pubspec.yaml
          git diff --cached --quiet || git commit -m "Dart client ${{ inputs.version }}"
          git tag -a "$tag" -m "Dart client v${{ inputs.version }}"
          git push origin HEAD:main --follow-tags
          if [ "$HAVE_PAT" = "true" ]; then
            echo "Tagged $tag. dart-publish.yml starts from that tag and uploads to pub.dev."
          else
            echo "::warning::Tagged $tag, but it was pushed with the run's own token, so no workflow"
            echo "::warning::started from it. Add SDK_MIRROR_TOKEN, or run dart-publish.yml by hand"
            echo "::warning::against the tag. pub.dev will only accept an upload started by the tag."
          fi

  # Secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, GPG_PRIVATE_KEY, GPG_PASSPHRASE.
  # Maven Central will not take an unsigned artefact. The group id is com.kuzikode.palsa, a namespace
  # verified with Sonatype against kuzikode.com, and the signing key's public half is published.
  java:
    needs: guard
    if: inputs.target == 'java'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Set the version
        working-directory: clients/java
        run: mvn -B versions:set -DnewVersion="${{ inputs.version }}" -DgenerateBackupPoms=false
      - name: Publish
        working-directory: clients/java
        run: mvn -B -Psign-artifacts deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # Kotlin is Gradle-only, so it cannot go through the Maven plugin. Gradle writes the artefacts into a
  # staging directory, they are signed there, and the whole thing is uploaded to the Central Portal as
  # one bundle, which is the route the Portal offers for builds that are not Maven.
  kotlin:
    needs: guard
    if: inputs.target == 'kotlin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }

      - name: Set the version
        working-directory: clients/kotlin
        run: sed -i "s|^version .*|version '${{ inputs.version }}'|" build.gradle

      - name: Build the artefacts
        working-directory: clients/kotlin
        # chmod, because a checkout only restores the executable bit if git recorded it, and a wrapper
        # that is not executable fails with a permission error that says nothing about why.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon publish

      - name: Sign everything in the staging directory
        working-directory: clients/kotlin
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd build/staging
          # Central checks a signature and both checksums for every artefact, metadata files aside.
          find . -type f ! -name '*.asc' ! -name '*.md5' ! -name '*.sha1' ! -name 'maven-metadata*' \
            -print0 | while IFS= read -r -d '' file; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign "$file"
            md5sum "$file" | cut -d' ' -f1 >"$file.md5"
            sha1sum "$file" | cut -d' ' -f1 >"$file.sha1"
          done
          rm -f $(find . -name 'maven-metadata*')

      - name: Upload the bundle to the Central Portal
        working-directory: clients/kotlin/build/staging
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          zip -qr ../bundle.zip .
          token=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@../bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=palsa-api-${{ inputs.version }}&publishingType=AUTOMATIC")
          body=$(printf '%s' "$response" | head -n -1)
          code=$(printf '%s' "$response" | tail -n1)
          echo "Central answered $code: $body"
          [ "$code" = "201" ] || { echo "Upload refused." >&2; exit 1; }
          echo "Deployment $body queued. Central validates and publishes it; watch it at"
          echo "https://central.sonatype.com/publishing/deployments"


  # Secret: NUGET_API_KEY.
  csharp:
    needs: guard
    if: inputs.target == 'csharp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Pack
        working-directory: clients/csharp
        run: dotnet pack src/Palsa.Api/Palsa.Api.csproj -c Release -p:PackageVersion="${{ inputs.version }}" -o out
      - name: Push
        working-directory: clients/csharp
        run: |
          dotnet nuget push out/*.nupkg \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # Secret: SDK_MIRROR_TOKEN, a token that may push to the two single-package repositories.
  #
  # Packagist reads composer.json only at a repository root and Swift Package Manager needs
  # Package.swift at one. Neither understands a subdirectory, so these two are published by copying
  # the client to the root of a repository of its own and tagging it. The copy is one-way: nothing is
  # ever edited there, and the next release overwrites it with whatever the specification produced.
  mirrored:
    needs: guard
    if: inputs.target == 'php' || inputs.target == 'swift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to the package repository and tag it
        env:
          MIRROR_TOKEN: ${{ secrets.SDK_MIRROR_TOKEN }}
        run: |
          case "${{ inputs.target }}" in
            php)   mirror=mhodieknowledge/palsa-php ;;
            swift) mirror=mhodieknowledge/palsa-swift ;;
          esac
          bash scripts/publish-mirror.sh "${{ inputs.target }}" "$mirror" "${{ inputs.version }}"

      # Packagist watches the repository but only notices a new tag when it is told to look, and a
      # first submission has to be done once by hand on packagist.org.
      - name: Ask Packagist to re-read the repository
        if: inputs.target == 'php'
        continue-on-error: true
        run: |
          curl -fsS -XPOST \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_API_TOKEN }}" \
            -H 'Content-Type: application/json' \
            -d '{"repository":{"url":"https://github.com/mhodieknowledge/palsa-php"}}' \
          && echo "Packagist told to re-read the repository." \
          || echo "Packagist did not accept that. If the package has never been submitted, add it once at packagist.org/packages/submit."

  # No secret and no registry: a Go module is published by tagging, and the tag for a module in a
  # subdirectory carries that subdirectory as its prefix.
  go:
    needs: guard
    if: inputs.target == 'go'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Tag the module
        run: |
          tag="clients/go/v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Go client v${{ inputs.version }}"
          git push origin "$tag"
          echo "Published as $tag. Fetch with:"
          echo "  go get github.com/mhodieknowledge/palsa-sdks/clients/go@v${{ inputs.version }}"
