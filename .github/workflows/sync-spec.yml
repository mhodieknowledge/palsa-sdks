# Keeping the clients in step with the API.
#
# The specification lives in mhodieknowledge/palsa beside the server it describes. This fetches it,
# regenerates, and commits if anything came out different, so an API change reaches all nine clients
# without anybody copying a file.
#
# The guard below is not decoration. When this was first written it fetched from main unconditionally,
# and main was sixty commits behind the branch the work was on, carrying a specification four
# kilobytes smaller. Had it run, it would have regenerated every client from a stale document and
# committed the result over the correct one. A regeneration that loses operations is a regression, and
# it is refused rather than published.
name: Sync the specification

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Which branch or tag of mhodieknowledge/palsa to take the specification from
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # Through the API rather than a raw URL: a branch name containing a slash makes the raw path
      # ambiguous and it answers 404 for a file that is plainly there.
      # mhodieknowledge/palsa is private, and this repository's own token cannot read another
      # repository. SPEC_READ_TOKEN is a fine-grained personal access token with Contents: Read on
      # that one repository and nothing else. Without it the job says so rather than failing on a
      # 404 that looks like a missing file.
      - name: Fetch the specification
        env:
          GH_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
          REF: ${{ inputs.ref || 'main' }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            cat >&2 <<'MESSAGE'
          No SPEC_READ_TOKEN.

          The specification lives in mhodieknowledge/palsa, which is private, so this workflow needs a
          token that may read it. Add a repository secret SPEC_READ_TOKEN holding a fine-grained
          personal access token scoped to that repository with Contents: Read.

          Nothing was changed.
          MESSAGE
            exit 1
          fi
          gh api "repos/mhodieknowledge/palsa/contents/openapi/palsa.yaml?ref=$REF" \
            --jq '.content' | base64 -d >/tmp/fetched.yaml
          test -s /tmp/fetched.yaml
          echo "Fetched $(wc -c </tmp/fetched.yaml) bytes from $REF."


      - name: Refuse a specification that has lost operations
        run: |
          count() { grep -c '^      operationId:' "$1" || true; }
          have=$(count openapi/palsa.yaml)
          incoming=$(count /tmp/fetched.yaml)
          echo "committed: $have operations, incoming: $incoming"
          if [ "$incoming" -lt "$have" ]; then
            echo "The incoming specification describes fewer operations than the one here." >&2
            echo "That is a regression, not an update. Nothing was changed." >&2
            exit 1
          fi
          cp /tmp/fetched.yaml openapi/palsa.yaml

      - name: Stop if it has not moved
        id: check
        run: |
          if git diff --quiet -- openapi/palsa.yaml; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "The specification is unchanged. Nothing to regenerate."
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Regenerate
        if: steps.check.outputs.changed == 'true'
        run: |
          npm install -g @openapitools/openapi-generator-cli
          bash scripts/generate-sdks.sh
          bash scripts/patch-sdks.sh

      - name: Check the metadata survived
        if: steps.check.outputs.changed == 'true'
        run: bash scripts/audit-metadata.sh --check

      - name: Commit the result
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate the clients from the current specification

          The specification in mhodieknowledge/palsa changed, so every client is rebuilt from it rather
          than edited. Review the diff before publishing a new version of any of them."
          git push
