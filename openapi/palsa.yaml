openapi: 3.1.0
info:
  title: Palsa API
  version: 1.0.0
  summary: Reach someone on SMS, email or push with one authenticated request.
  description: |
    Palsa is prepaid. Credit is reserved before anything reaches a supplier and only what a supplier
    accepted is charged, so a balance cannot go below nothing. `QUOTA_EXCEEDED` means exactly that: the
    workspace could not pay for the send, and nothing was sent.

    A key belongs to one workspace, so no path here names a workspace and no key can reach another's data.

    What happened to a send is reported by webhook, signed as
    `Palsa-Signature: t=<milliseconds>,v1=<hex>`: an HMAC-SHA256 over `<t>.<raw body>`. Verify against the
    raw body, because parsing and re-serialising it changes the bytes, and refuse a signature older than
    five minutes, which is what stops an old delivery being replayed at you later. Every client library
    ships a verifier, since no generator produces one.

    **This file is generated from nothing and generates everything.** Every Palsa client library is
    produced from it, so an API change is a change here followed by a regeneration. It is also tested
    against the running server, because a specification is a claim about what the server does and a wrong
    claim would be inherited by every client at once.
  contact:
    name: Kuzikode Intelligent Technologies
    url: https://palsa.mhodieknowledge.workers.dev/contact
  # The licence the generated client libraries carry. MIT is the convention for an API client and is
  # what makes one usable at all: a library with no licence may not legally be used by anybody. Change
  # it here and regenerate if the company wants different terms.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://palsa.mhodieknowledge.workers.dev
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Notifications
    description: Sending, and what happened to a send.
  - name: Verification
    description: One-time codes.
  - name: Contacts
    description: People and their devices.
  - name: Billing
    description: What credit is left.

paths:
  /v1/notifications:
    post:
      tags: [Notifications]
      operationId: sendNotification
      summary: Send a notification
      description: |
        Reserves credit, then sends. A key beginning `pk_test_` is a sandbox key: the send is accepted,
        costs nothing and reaches nobody.

        Pass `Idempotency-Key` for anything that must not go twice. A repeat with the same key returns the
        first answer and sends nothing more, which is what makes retrying after a timeout safe.

        Requires the `notifications.send` scope.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendRequest' }
      responses:
        '202':
          description: Accepted. Dispatch continues after the response.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SendResult' }
        '200':
          description: A replay of an earlier request with the same idempotency key. Nothing was sent again.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SendResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '429': { $ref: '#/components/responses/RateLimited' }

    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List sends
      description: |
        Newest first, paginated by cursor rather than offset, because an offset drifts while new sends
        arrive. Requires the `notifications.read` scope.
      parameters:
        - name: status
          in: query
          description: Only sends in this state.
          schema: { type: string, maxLength: 30 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: The `nextCursor` from a previous page.
          schema: { type: string, maxLength: 80 }
      responses:
        '200':
          description: A page of sends.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [notifications]
                    properties:
                      notifications:
                        type: array
                        items: { $ref: '#/components/schemas/NotificationSummary' }
                  meta:
                    type: object
                    properties:
                      nextCursor:
                        type: [string, 'null']
                        description: Null on the last page.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/notifications/{id}:
    get:
      tags: [Notifications]
      operationId: getNotification
      summary: One send
      description: Requires the `notifications.read` scope.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The send, with its delivery counts by state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/quotes:
    post:
      tags: [Notifications]
      operationId: quoteSend
      summary: Price a send without making it
      description: |
        The same calculation the send itself uses: what it would cost, who would be left out and why, and
        anything that would stop it. Reserves nothing and sends nothing.

        Note the size of the answer. `recipients` carries a row per recipient per channel, including their
        address, so quoting a fifty-thousand-contact audience returns fifty thousand rows. Read
        `recipientCount` and `units` unless you need the rows themselves.

        Requires the `notifications.send` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendRequest' }
      responses:
        '200':
          description: What the send would cost.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/balances:
    get:
      tags: [Billing]
      operationId: getBalances
      summary: Prepaid balances
      description: |
        What is available now, what is already promised to sends in flight, and what has been used, per
        channel. Requires the `analytics.read` scope.
      responses:
        '200':
          description: The balance of each channel.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [balances]
                    properties:
                      balances:
                        type: array
                        items: { $ref: '#/components/schemas/Balance' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/verifications:
    post:
      tags: [Verification]
      operationId: startVerification
      summary: Send a one-time code
      description: |
        Palsa generates the code, keeps only a salted hash of it and sends it to the recipient, so nobody
        else ever sees it. With a sandbox key it comes back as `sandboxCode`, which is what lets you
        integrate without a handset.

        At most five challenges per address every fifteen minutes. A code counts as a transactional send,
        so quiet hours do not hold it. Requires the `verifications.write` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationRequest' }
      responses:
        '201':
          description: The challenge. `sandboxCode` is present only for a sandbox key.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Verification' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/verifications/{id}/check:
    post:
      tags: [Verification]
      operationId: checkVerification
      summary: Check a code
      description: |
        Wrong guesses are counted and the challenge locks after too many, so do not guess. Requires the
        `verifications.write` scope.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 4, maxLength: 10 }
      responses:
        '200':
          description: The state of the challenge after this attempt.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/VerificationCheck' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      summary: List contacts
      description: Newest first. Requires the `contacts.read` scope.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: The contacts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [contacts]
                    properties:
                      contacts:
                        type: array
                        items: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

    post:
      tags: [Contacts]
      operationId: createContact
      summary: Save a contact
      description: |
        Give an email address or a phone number, or both. `state` is `pending` unless you can show the
        person consented, and marketing only goes to `consented` contacts. Requires the `contacts.write`
        scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/contacts/{id}:
    delete:
      tags: [Contacts]
      operationId: deleteContact
      summary: Erase a contact
      description: |
        Requires the `contacts.write` scope.

        Here as well as in the console because a deletion request reaches your application at least as
        often as it reaches your staff.

        Their deliveries are kept and their address is removed from them, so the record of what was sent
        and charged survives without saying who it went to. A suppression for that address is also kept:
        dropping it would mean the same person, imported again later, is sent to after asking not to be.
        Their devices and audience memberships go with them.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The contact is gone.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      # A plain boolean, not an enum of one value: the Dart generator turns a
                      # single-valued boolean enum into a class holding the string 'true', which does
                      # not compile, and it says nothing the type does not already.
                      deleted: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/devices:
    post:
      tags: [Contacts]
      operationId: registerDevice
      summary: Register a device for push
      description: |
        Registering the same token again updates it rather than adding another, and revives one that had
        been invalidated. Requires the `contacts.write` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegister' }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [registered]
                    properties:
                      registered: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/mcp:
    get:
      tags: [Notifications]
      operationId: describeMcp
      summary: What the MCP endpoint is
      description: |
        Palsa speaks the Model Context Protocol at this address, as JSON-RPC 2.0 over HTTP POST. It is
        deliberately **not** modelled as typed operations here: a generated method per JSON-RPC call would
        describe the transport rather than the protocol, and an agent should reach it through an MCP
        client, not a Palsa SDK.

        Requires the `notifications.read` scope.

        An agent gets exactly the scopes and the mode of the key it is given. A sandbox key is the one to
        give it first.
      responses:
        '200':
          description: A description of the endpoint and the tools it offers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthenticated' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer pk_live_…` or `pk_test_…`. A `pk_test_` key is a sandbox key: a send is
        accepted, costs nothing and reaches nobody. Keep a live key on a server; it is not for anything a
        user can read.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: A repeat with the same key returns the first answer and sends nothing more.
      schema: { type: string, maxLength: 100 }

  responses:
    Unauthenticated:
      description: No key, or a key that has been revoked.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: The key is missing the scope this operation needs.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: No such thing in this workspace. An id from elsewhere answers the same way.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: That already exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationFailed:
      description: The request was wrong. `fields` names what, by field.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    QuotaExceeded:
      description: |
        The workspace cannot pay for this, and nothing was sent. `detail` names the channel, how much was
        needed and how much was available.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many requests for this key's plan. Try again shortly.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    Channel:
      type: string
      enum: [sms, email, push]
      description: |
        SMS is charged per 160-character segment, and one character outside GSM 03.38 forces the whole
        message to Unicode, which more than halves what fits. Email is one unit per message. Push costs
        no prepaid units.

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }

    Error:
      type: object
      required: [code, message]
      description: |
        `code` is stable and worth branching on. `message` is written for a person and may change, so do
        not match on it.
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - QUOTA_EXCEEDED
            - RATE_LIMITED
            - PROVIDER_ERROR
            - INTERNAL
        message: { type: string }
        fields:
          type: object
          description: Validation errors by field name.
          additionalProperties:
            type: array
            items: { type: string }
        detail:
          type: object
          description: Machine-readable specifics, such as the channel and shortfall on QUOTA_EXCEEDED.
          additionalProperties: true
        requestId:
          type: string
          description: Quote this when asking us about a request.

    Recipients:
      type: object
      description: Who the send goes to. Give exactly one of these three.
      properties:
        contactIds:
          type: array
          maxItems: 50000
          items: { type: string, maxLength: 60 }
        addresses:
          type: array
          maxItems: 1000
          description: Phone numbers or email addresses, for people who are not saved contacts.
          items: { type: string, maxLength: 200 }
        audienceId: { type: string, maxLength: 60 }

    SendRequest:
      type: object
      required: [channels, to]
      properties:
        channels:
          type: array
          minItems: 1
          maxItems: 3
          description: Tried in the order given. With `fallback` routing the next is used only if the previous does not work out.
          items: { $ref: '#/components/schemas/Channel' }
        to: { $ref: '#/components/schemas/Recipients' }
        body:
          type: string
          minLength: 1
          maxLength: 20000
          description: Required unless `templateId` is given. Supports `{{ name }}` and your own variables.
        subject: { type: string, maxLength: 200, description: Email only. }
        templateId: { type: string, maxLength: 60 }
        variables:
          type: object
          additionalProperties: true
        purpose:
          type: string
          enum: [marketing, transactional]
          default: transactional
          description: |
            Marketing only reaches contacts who consented to it and is held during quiet hours.
            Transactional is neither.

            A marketing email also carries an unsubscribe link, added for you: a line at the end of the
            body, and the `List-Unsubscribe` and `List-Unsubscribe-Post` headers a mail client reads to
            show its own unsubscribe button. Following it suppresses that address and marks the contact
            unsubscribed, so later sends skip them. Nothing is added to a transactional message, and
            nothing is added to SMS, which is charged by segment and would cost more than was quoted.
        routing:
          type: string
          enum: [parallel, fallback]
          default: parallel
        fallbackOn:
          type: string
          enum: [failure, timeout, unacknowledged]
          default: failure
          description: |
            With `fallback` routing, what counts as not working out. A refusal falls back whichever is
            chosen; `timeout` also falls back when nothing was delivered within the wait, and
            `unacknowledged` when nothing was read, which needs your own read callback wired up.
        fallbackWaitSeconds: { type: integer, minimum: 1, maximum: 604800 }
        variantBody:
          type: string
          maxLength: 20000
          description: An A/B test's second message. Each arm is costed from its own body, so a longer B costs more.
        variantSubject: { type: string, maxLength: 200 }
        splitPercent: { type: integer, minimum: 0, maximum: 100, description: The share of the audience that gets variant B. }
        trackLinks:
          type: boolean
          default: false
          description: |
            Rewrites the links so a click can be attributed to a recipient. A tracked link is longer than
            the one you typed, so it can add an SMS segment; the quote counts what will really be sent.
        quietStart:
          type: [string, 'null']
          maxLength: 5
          description: '24-hour local time, e.g. "22:00". Both ends are needed or neither applies.'
        quietEnd: { type: [string, 'null'], maxLength: 5 }
        timezone: { type: [string, 'null'], maxLength: 60, description: 'An IANA zone, e.g. "Africa/Harare".' }
        attachmentIds:
          type: array
          maxItems: 10
          description: Email only. Ids of files already uploaded to this workspace.
          items: { type: string, maxLength: 60 }
        deepLink: { type: string, maxLength: 500, description: Push only. }
        ttlSeconds: { type: integer, minimum: 0, maximum: 2419200, description: Push only. How long it stays worth delivering. }
        priority: { type: string, enum: [high, normal], description: Push only. }
        badge:
          type: integer
          minimum: 0
          maximum: 99999
          description: 'Push only. The number on the app icon. Zero is meaningful: it clears the badge.'
        imageUrl:
          type: string
          format: uri
          maxLength: 500
          description: Push only. A picture shown with the notification.
        scheduledAt: { type: [string, 'null'], maxLength: 40, description: ISO 8601. Omit to send now. }
        callbackUrl: { type: string, format: uri, maxLength: 500 }
        metadata:
          type: object
          description: Yours. Returned on the send and on webhooks about it.
          additionalProperties: true
        name: { type: string, maxLength: 120, description: Also seeds the A/B division, so a preview and the send divide the audience alike. }

    UnitsByChannel:
      type: object
      description: Billable units, per channel.
      additionalProperties: { type: integer }

    SendResult:
      type: object
      required: [id, status, mode, recipients, units, skipped, warnings]
      properties:
        id: { type: string }
        status:
          type: string
          description: '`running`, `scheduled` when held or scheduled, or `pending_approval`.'
        mode: { type: string, enum: [live, sandbox] }
        recipients: { type: integer }
        units: { $ref: '#/components/schemas/UnitsByChannel' }
        skipped: { type: integer, description: How many recipients were left out. The quote says why. }
        warnings:
          type: array
          description: Things that did not stop the send.
          items: { $ref: '#/components/schemas/Blocker' }

    Blocker:
      type: object
      required: [code, message, skippable]
      properties:
        code: { type: string }
        message: { type: string }
        skippable:
          type: boolean
          description: False stops the send outright. True means it proceeds with those recipients left out.
        count: { type: integer }

    SkippedRecipient:
      type: object
      required: [address, reason]
      properties:
        address: { type: string }
        reason: { type: string }

    QuotedRecipient:
      type: object
      required: [contactId, address, channel, name, fields, units, variant]
      properties:
        contactId: { type: [string, 'null'] }
        address: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        name: { type: string }
        fields:
          type: object
          additionalProperties: true
        units: { type: integer, description: What this one recipient costs, after their own variables and their own variant. }
        variant: { type: string, enum: [A, B] }

    Quote:
      type: object
      required: [channels, recipients, units, recipientCount, skipped, blockers, sms, variants, trackedLinks, heldUntil, estimateMinor, currency]
      properties:
        channels:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
        recipients:
          type: object
          description: |
            A row per recipient per channel. Large: quoting a fifty-thousand-contact audience returns
            fifty thousand rows, so read `recipientCount` unless you need the rows.
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/QuotedRecipient' }
        units: { $ref: '#/components/schemas/UnitsByChannel' }
        recipientCount: { type: integer }
        skipped:
          type: array
          items: { $ref: '#/components/schemas/SkippedRecipient' }
        blockers:
          type: array
          description: 'Everything standing in the way. Those with `skippable: false` stop the send.'
          items: { $ref: '#/components/schemas/Blocker' }
        sms:
          type: object
          required: [encoding, segments]
          properties:
            encoding: { type: string, enum: ['GSM-7', Unicode] }
            segments: { type: integer }
        variants:
          type: object
          required: [A, B]
          description: How the audience divides between the two arms of an A/B test.
          properties:
            A: { type: integer }
            B: { type: integer }
        trackedLinks:
          type: array
          description: The links that will be rewritten. Empty when tracking is off or nothing can be tracked.
          items: { type: string }
        heldUntil:
          type: [object, 'null']
          description: Set when quiet hours will hold this send, with when it would go and in which zone.
          properties:
            at: { type: string }
            timeZone: { type: string }
        estimateMinor: { type: integer, description: What the units would cost at the published top-up rate, in minor currency units. For display only. }
        currency: { type: string }

    NotificationSummary:
      type: object
      required: [id, kind, name, status, recipient_count, created_at]
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: string }
        status: { type: string }
        recipient_count: { type: integer }
        created_at: { type: string }

    Notification:
      type: object
      required: [id, kind, status, reserved_units, settled_units, recipient_count, created_at, deliveries]
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: [string, 'null'] }
        status: { type: string }
        reserved_units: { $ref: '#/components/schemas/UnitsByChannel' }
        settled_units: { $ref: '#/components/schemas/UnitsByChannel' }
        recipient_count: { type: integer }
        scheduled_at: { type: [string, 'null'] }
        started_at: { type: [string, 'null'] }
        finished_at: { type: [string, 'null'] }
        failure_reason: { type: [string, 'null'] }
        metadata: { type: [string, 'null'], description: The JSON you sent, as stored. }
        created_at: { type: string }
        deliveries:
          type: object
          description: How many deliveries are in each state.
          additionalProperties: { type: integer }

    Balance:
      type: object
      required:
        - channel
        - included
        - purchased
        - reservedIncluded
        - reservedPurchased
        - usedIncluded
        - usedPurchased
        - available
      description: |
        Reservations and usage are split by where the units came from, because included units are spent
        before purchased ones: the allowance the customer has already paid for goes first, and what they
        bought separately is kept for when it runs out.
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        included: { type: integer, description: The plan's allowance for this period. }
        purchased: { type: integer, description: Credit bought separately, which does not expire with the period. }
        reservedIncluded: { type: integer, description: Included units promised to sends in flight. }
        reservedPurchased: { type: integer, description: Purchased units promised to sends in flight. }
        usedIncluded: { type: integer }
        usedPurchased: { type: integer }
        available:
          type: integer
          description: |
            `included + purchased - reserved`, and what a send is actually checked against. It cannot go
            below nothing.
        periodEnd:
          type: [string, 'null']
          description: When the included allowance expires. Purchased units are unaffected by it.

    VerificationRequest:
      type: object
      required: [channel, to]
      properties:
        channel: { type: string, enum: [sms, email] }
        to: { type: string, minLength: 3, maxLength: 200 }
        length: { type: integer, minimum: 4, maximum: 8, default: 6 }
        expiresInSeconds: { type: integer, minimum: 60, maximum: 3600, default: 600 }
        template:
          type: string
          maxLength: 200
          description: 'Use `{{code}}` and `{{minutes}}`. Defaults to "Your code is {{code}}. It expires in {{minutes}} minutes."'
        flow:
          type: string
          maxLength: 120
          description: |
            The name of one of your active verification flows, set up in the console under Verification.
            Its expiry, attempt ceiling and rate apply to this challenge.

            A name matching no active flow is refused with `NOT_FOUND` rather than falling back to the
            defaults, since a silent fallback is how somebody comes to believe a code allows three
            guesses when it allows five. A flow's rate applies in addition to the built-in ceiling of
            five requests per address every fifteen minutes, so a flow can tighten it and cannot loosen
            it.

    Verification:
      type: object
      required: [id, channel, to, expiresAt]
      properties:
        id: { type: string }
        channel: { type: string, enum: [sms, email] }
        to: { type: string }
        expiresAt: { type: string }
        sandboxCode:
          type: string
          description: Only with a sandbox key. Never returned for a live send, to anyone, including the workspace that asked.

    VerificationCheck:
      type: object
      required: [id, state]
      properties:
        id: { type: string }
        state: { type: string, enum: [pending, verified, expired, locked] }
        attemptsLeft: { type: integer, description: Present while still pending. }

    Contact:
      type: object
      required: [id, name, state, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        state: { type: string, enum: [consented, pending, unsubscribed, bounced] }
        tags: { type: [string, 'null'], description: JSON array, as stored. }
        created_at: { type: string }

    ContactCreate:
      type: object
      description: Give an email address or a phone number, or both.
      properties:
        name: { type: string, maxLength: 120, default: '' }
        email: { type: [string, 'null'], format: email, maxLength: 200 }
        phone: { type: [string, 'null'], maxLength: 30 }
        state:
          type: string
          enum: [consented, pending]
          default: pending
          description: Only `consented` contacts receive marketing. Say `consented` only if you can show they did.
        consentSource: { type: [string, 'null'], maxLength: 120, description: Where consent came from. Worth recording. }
        tags:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 40 }
        fields:
          type: object
          description: Your own fields, usable as `{{ variables }}` in a body.
          additionalProperties: { type: string, maxLength: 500 }

    DeviceRegister:
      type: object
      required: [token, platform]
      properties:
        token: { type: string, minLength: 10, maxLength: 400 }
        platform: { type: string, enum: [android, ios, web] }
        contactId: { type: [string, 'null'], maxLength: 60 }
        appVersion: { type: [string, 'null'], maxLength: 40 }
        locale: { type: [string, 'null'], maxLength: 10 }
