openapi: 3.1.0
info:
  contact:
    name: Kuzikode Intelligent Technologies
    url: https://palsa.co.zw/contact
  description: |
    Palsa is prepaid. Credit is reserved before anything reaches a supplier and only what a supplier
    accepted is charged, so a balance cannot go below nothing. `QUOTA_EXCEEDED` means exactly that: the
    workspace could not pay for the send, and nothing was sent.

    A key belongs to one workspace, so no path here names a workspace and no key can reach another's data.

    What happened to a send is reported by webhook, signed as
    `Palsa-Signature: t=<milliseconds>,v1=<hex>`: an HMAC-SHA256 over `<t>.<raw body>`. Verify against the
    raw body, because parsing and re-serialising it changes the bytes, and refuse a signature older than
    five minutes, which is what stops an old delivery being replayed at you later. Every client library
    ships a verifier, since no generator produces one.

    **This file is generated from nothing and generates everything.** Every Palsa client library is
    produced from it, so an API change is a change here followed by a regeneration. It is also tested
    against the running server, because a specification is a claim about what the server does and a wrong
    claim would be inherited by every client at once.
  license:
    name: MIT
  title: Palsa API
  version: 1.0.0
servers:
- description: Production
  url: https://api.palsa.co.zw
security:
- bearerAuth: []
tags:
- description: "Sending, and what happened to a send."
  name: Notifications
- description: One-time codes.
  name: Verification
- description: People and their devices.
  name: Contacts
- description: What credit is left.
  name: Billing
- description: "The domains a workspace sends email from, verified with Amazon SES."
  name: Sending domains
- description: |
    Push goes out through the customer's own Firebase project, because a device token only works through the
    project of the app that minted it. Each app is connected once, with a service-account key (stored
    encrypted, never returned) or by granting Palsa's service account the Firebase Cloud Messaging API Admin
    role on the project. Topics are namespaced per workspace, so no customer can address another's.
  name: Push
paths:
  /v1/notifications:
    get:
      description: |
        Newest first, paginated by cursor rather than offset, because an offset drifts while new sends
        arrive. Requires the `notifications.read` scope.
      operationId: listNotifications
      parameters:
      - description: Only sends in this state.
        explode: true
        in: query
        name: status
        required: false
        schema:
          maxLength: 30
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: The `nextCursor` from a previous page.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          maxLength: 80
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listNotifications_200_response"
          description: A page of sends.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: List sends
      tags:
      - Notifications
    post:
      description: |
        Reserves credit, then sends. A key beginning `pk_test_` is a sandbox key: the send is accepted,
        costs nothing and reaches nobody.

        Pass `Idempotency-Key` for anything that must not go twice. A repeat with the same key returns the
        first answer and sends nothing more, which is what makes retrying after a timeout safe.

        Requires the `notifications.send` scope.
      operationId: sendNotification
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sendNotification_202_response"
          description: Accepted. Dispatch continues after the response.
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sendNotification_202_response"
          description: A replay of an earlier request with the same idempotency key.
            Nothing was sent again.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Send a notification
      tags:
      - Notifications
  /v1/notifications/{id}:
    get:
      description: Requires the `notifications.read` scope.
      operationId: getNotification
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getNotification_200_response"
          description: "The send, with its delivery counts by state."
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: One send
      tags:
      - Notifications
  /v1/quotes:
    post:
      description: |
        The same calculation the send itself uses: what it would cost, who would be left out and why, and
        anything that would stop it. Reserves nothing and sends nothing.

        Note the size of the answer. `recipients` carries a row per recipient per channel, including their
        address, so quoting a fifty-thousand-contact audience returns fifty thousand rows. Read
        `recipientCount` and `units` unless you need the rows themselves.

        Requires the `notifications.send` scope.
      operationId: quoteSend
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/quoteSend_200_response"
          description: What the send would cost.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Price a send without making it
      tags:
      - Notifications
  /v1/balances:
    get:
      description: |
        What is available now, what is already promised to sends in flight, and what has been used, per
        channel. Requires the `analytics.read` scope.
      operationId: getBalances
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getBalances_200_response"
          description: The balance of each channel.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Prepaid balances
      tags:
      - Billing
  /v1/verifications:
    post:
      description: |
        Palsa generates the code, keeps only a salted hash of it and sends it to the recipient, so nobody
        else ever sees it. With a sandbox key it comes back as `sandboxCode`, which is what lets you
        integrate without a handset.

        At most five challenges per address every fifteen minutes. A code counts as a transactional send,
        so quiet hours do not hold it. Requires the `verifications.write` scope.
      operationId: startVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/startVerification_201_response"
          description: The challenge. `sandboxCode` is present only for a sandbox
            key.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Send a one-time code
      tags:
      - Verification
  /v1/verifications/{id}/check:
    post:
      description: |
        Wrong guesses are counted and the challenge locks after too many, so do not guess. Requires the
        `verifications.write` scope.
      operationId: checkVerification
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/checkVerification_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/checkVerification_200_response"
          description: The state of the challenge after this attempt.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Check a code
      tags:
      - Verification
  /v1/contacts:
    get:
      description: Newest first. Requires the `contacts.read` scope.
      operationId: listContacts
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listContacts_200_response"
          description: The contacts.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: List contacts
      tags:
      - Contacts
    post:
      description: |
        Give an email address or a phone number, or both. `state` is `pending` unless you can show the
        person consented, and marketing only goes to `consented` contacts. Requires the `contacts.write`
        scope.
      operationId: createContact
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createContact_201_response"
          description: Created.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Save a contact
      tags:
      - Contacts
  /v1/contacts/{id}:
    delete:
      description: |
        Requires the `contacts.write` scope.

        Here as well as in the console because a deletion request reaches your application at least as
        often as it reaches your staff.

        Their deliveries are kept and their address is removed from them, so the record of what was sent
        and charged survives without saying who it went to. A suppression for that address is also kept:
        dropping it would mean the same person, imported again later, is sent to after asking not to be.
        Their devices and audience memberships go with them.
      operationId: deleteContact
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteContact_200_response"
          description: The contact is gone.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Erase a contact
      tags:
      - Contacts
  /v1/sending-domains:
    get:
      description: |
        Every domain this workspace sends email from, with its verification state and the DNS records to
        publish. Requires the `domains.read` scope.
      operationId: listSendingDomains
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listSendingDomains_200_response"
          description: The domains.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: List sending domains
      tags:
      - Sending domains
    post:
      description: |
        Registers the domain with Amazon SES under this workspace's own tenant and returns the DNS records
        to publish: three DKIM CNAMEs, and an MX and SPF TXT for the custom MAIL FROM `bounce.<domain>`.
        Palsa checks automatically and the domain becomes `verified` once SES finds them. A domain another
        workspace holds is refused. Requires the `domains.write` scope.

        Until email sending is live the domain is stored as `awaiting_provider` with no records; they
        appear as soon as it is.
      operationId: addSendingDomain
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/addSendingDomain_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/addSendingDomain_201_response"
          description: "The domain, with its records."
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Add a sending domain
      tags:
      - Sending domains
  /v1/sending-domains/{id}:
    delete:
      description: |
        Removes the domain from Amazon SES and stops every address on it. Requires the `domains.write` scope.
      operationId: removeSendingDomain
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/removeSendingDomain_200_response"
          description: The domain is gone.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Remove a sending domain
      tags:
      - Sending domains
    get:
      description: Requires the `domains.read` scope.
      operationId: getSendingDomain
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/addSendingDomain_201_response"
          description: The domain.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Get a sending domain
      tags:
      - Sending domains
  /v1/sending-domains/{id}/check:
    post:
      description: |
        Asks SES straight away rather than waiting for the next automatic check. Up to twelve times an hour
        per domain. Requires the `domains.write` scope.
      operationId: checkSendingDomain
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/addSendingDomain_201_response"
          description: The domain as it now is.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Check a sending domain now
      tags:
      - Sending domains
  /v1/devices:
    get:
      description: "The newest 200, optionally for one contact. Tokens are never returned.\
        \ Requires the `contacts.read` scope."
      operationId: listDevices
      parameters:
      - explode: true
        in: query
        name: contactId
        required: false
        schema:
          maxLength: 60
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDevices_200_response"
          description: The devices.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: List registered devices
      tags:
      - Contacts
    post:
      description: |
        Registering the same token again updates it rather than adding another, and revives one that had
        been invalidated. Requires the `contacts.write` scope.
      operationId: registerDevice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegister"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/registerDevice_201_response"
          description: Registered.
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/registerDevice_201_response"
          description: A refreshed token replaced `previousToken` in place.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Register a device for push
      tags:
      - Contacts
  /v1/devices/unregister:
    post:
      description: "For sign-out, or when the person turns notifications off. The\
        \ device leaves its topics. Requires the `contacts.write` scope."
      operationId: unregisterDevice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/unregisterDevice_request"
        required: true
      responses:
        "200":
          $ref: "#/components/responses/PushOk"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Stop sending to a device
      tags:
      - Contacts
  /v1/push-apps:
    get:
      description: Requires the `push.read` scope.
      operationId: listPushApps
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listPushApps_200_response"
          description: The workspace's apps.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: List push apps
      tags:
      - Push
    post:
      description: |
        With `service_account`, the key is checked with Firebase (a validate-only message, which sends
        nothing) and the app is verified at once. With `delegated`, grant `grantTo` the Firebase Cloud
        Messaging API Admin role on the project, then prove ownership with a code sent to one of your devices.
        Requires the `push.write` scope.
      operationId: addPushApp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushAppCreate"
        required: true
      responses:
        "201":
          $ref: "#/components/responses/PushAppResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Connect an app's Firebase project
      tags:
      - Push
  /v1/push-apps/{id}:
    delete:
      description: Its key is deleted and its devices stop receiving push. Requires
        the `push.write` scope.
      operationId: removePushApp
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          $ref: "#/components/responses/PushOk"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Remove a push app
      tags:
      - Push
    get:
      description: Requires the `push.read` scope.
      operationId: getPushApp
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          $ref: "#/components/responses/PushAppResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Get a push app
      tags:
      - Push
    patch:
      description: Requires the `push.write` scope.
      operationId: updatePushApp
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updatePushApp_request"
        required: true
      responses:
        "200":
          $ref: "#/components/responses/PushAppResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Rename a push app or make it the default
      tags:
      - Push
  /v1/push-apps/{id}/key:
    put:
      description: For rotating a key. The new one must be for the same project. Requires
        the `push.write` scope.
      operationId: replacePushAppKey
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/replacePushAppKey_request"
        required: true
      responses:
        "200":
          $ref: "#/components/responses/PushAppResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Replace a push app's service-account key
      tags:
      - Push
  /v1/push-apps/{id}/check:
    post:
      description: Requires the `push.write` scope.
      operationId: checkPushApp
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          $ref: "#/components/responses/PushAppResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Check a push app's access again
      tags:
      - Push
  /v1/push-apps/{id}/ownership-code:
    post:
      description: "Delegated apps only. The code arrives as a notification and as\
