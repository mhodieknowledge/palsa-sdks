    Balance:
      description: |
        Reservations and usage are split by where the units came from, because included units are spent
        before purchased ones: the allowance the customer has already paid for goes first, and what they
        bought separately is kept for when it runs out.
      example:
        purchased: 6
        usedIncluded: 5
        usedPurchased: 2
        channel: sms
        available: 7
        reservedPurchased: 5
        reservedIncluded: 1
        included: 0
        periodEnd: periodEnd
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        included:
          description: The plan's allowance for this period.
          type: integer
        purchased:
          description: Credit bought separately
          type: integer
        reservedIncluded:
          description: Included units promised to sends in flight.
          type: integer
        reservedPurchased:
          description: Purchased units promised to sends in flight.
          type: integer
        usedIncluded:
          type: integer
        usedPurchased:
          type: integer
        available:
          description: |
            `included + purchased - reserved`, and what a send is actually checked against. It cannot go
            below nothing.
          type: integer
        periodEnd:
          description: When the included allowance expires. Purchased units are unaffected
            by it.
          nullable: true
          type: string
      required:
      - available
      - channel
      - included
      - purchased
      - reservedIncluded
      - reservedPurchased
      - usedIncluded
      - usedPurchased
    VerificationRequest:
      example:
        template: template
        channel: sms
        length: 4
        to: to
        expiresInSeconds: 2193
        flow: flow
      properties:
        channel:
          enum:
          - sms
          - email
          type: string
        to:
          maxLength: 200
          minLength: 3
          type: string
        length:
          default: 6
          maximum: 8
          minimum: 4
          type: integer
        expiresInSeconds:
          default: 600
          maximum: 3600
          minimum: 60
          type: integer
        template:
          description: "Use `{{code}}` and `{{minutes}}`. Defaults to \"Your code\
            \ is {{code}}. It expires in {{minutes}} minutes.\""
          maxLength: 200
          type: string
        flow:
          description: |
            The name of one of your active verification flows, set up in the console under Verification.
            Its expiry, attempt ceiling and rate apply to this challenge.

            A name matching no active flow is refused with `NOT_FOUND` rather than falling back to the
            defaults, since a silent fallback is how somebody comes to believe a code allows three
            guesses when it allows five. A flow's rate applies in addition to the built-in ceiling of
            five requests per address every fifteen minutes, so a flow can tighten it and cannot loosen
            it.
          maxLength: 120
          type: string
      required:
      - channel
      - to
